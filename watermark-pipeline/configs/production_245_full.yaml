# The 245 instances below are already issue-generated, validated, and built
# into their repository-specific local images. This replay consumes every one
# of them; no task-limit selection is applied.
swesmith:
  task_source: existing
  enabled: false
  project_dir: SWE-smith
  existing_task_file: watermark-pipeline/runs/mixed-100-20261016/tasks/tasks_all245.json
  task_limit: null
  required_task_count: null

sweagent:
  executable: .venv/bin/sweagent
  project_dir: SWE-agent
  config: SWE-agent/config/swesmith_deepseek_flash.yaml
  docker_group_wrapper: true
  docker_group: docker
  # The workstation proxy is exposed to bridge-network containers through the
  # host-gateway forward on port 17895. Keep independent container networking
  # so SWE-ReX can allocate one runtime port per task.
  container_proxy_url: http://host.docker.internal:17895
  startup_timeout: 600
  num_workers: 5

