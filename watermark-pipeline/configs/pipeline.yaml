workspace_root: ../..

run:
  output_root: watermark-pipeline/runs
  resume: true

swesmith:
  task_source: local_production
  enabled: true
  project_dir: SWE-smith
  # The first local_repository_limit profiles are enabled for this run.
  # Base image and task repo names are derived from each SWE-smith profile.
  # Use a mapping when a repository needs a non-main base branch or overrides.
  local_repositories:
    - pallets__markupsafe.620c06c9
    - pallets__click.fde47b4b
    - pallets__flask.bc098406
    - pallets__jinja.ada0a9a6
    - profile: marshmallow-code__marshmallow.9716fc62
      base_branch: dev
  local_repository_limit: 5
  local_generator: lm_modify
  local_generator_config: configs/bug_gen/lm_modify.yml
  local_generator_model: deepseek/deepseek-flash
  local_generation_workers: 1
  local_validation_workers: 5
  local_issue_mode: llm
  issue_gen_config: watermark-pipeline/configs/issue_gen/ig_deepseek.yaml
  issue_gen_workers: 4
  local_image_tag_prefix: wm-local
  # Number of bug-generation attempts to start across selected repositories.
  max_bugs: 30
  task_limit: 30
  required_task_count: null

sweagent:
  executable: .venv/bin/sweagent
  project_dir: SWE-agent
  config: SWE-agent/config/swesmith_deepseek_flash.yaml
  docker_group_wrapper: true
  docker_group: docker
  num_workers: 1

sampler:
  model: deepseek/deepseek-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  watermark: "00001100001010101101001001110000011111110000101001000100010110010100111000001000011110000100001100110111110000010101010111111000"
  code_key: "e4553c974e2b4bcf81036788012c48fcd34bdd1caee54113d68453e07a3ff591"
  task_key: "020619c1b5aaa7bf95d86bafd2a263701e43ce282ad45f9a1ba1bb48df772dfd"
  response_key: "76db9f1e1d2c50ab2746f5bc59d7df2fabfabd70bd0b869510facf95bb78122a"
  key_id: local-v2-three-key
  max_attempts: 32
  candidates_per_round: 4
  code_modulus: 2147483647
  modulus: 4
  target: 0

export:
  write_derived_trajectory: true
